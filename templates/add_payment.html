<!DOCTYPE html>
<html>
<head>
    <title>Add Payment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
    <nav class="navbar">
    <a href="{{ url_for('index') }}">Products</a>
    <a href="{{ url_for('customers') }}">Customers</a>
    <a href="{{ url_for('suppliers') }}">Suppliers</a>
    <a href="{{ url_for('employees') }}">Employees</a>
    <a href="{{ url_for('sales') }}">Sales</a>
    <a href="{{ url_for('payments') }}">Payments</a>
</nav>
<hr>

    <h1>Add Payment</h1>
    <form method="POST">
        Sale:
        <select name="sale" required>
            {% for s in sales %}
            <option value="{{ s['SaleID'] }}">Sale #{{ s['SaleID'] }}</option>
            {% endfor %}
        </select><br>
        Amount: <input type="number" step="0.01" name="amount" required><br>
        Method: <input type="text" name="method"><br>
        Payment Date: <input type="date" name="date" required><br>
        <button type="submit">Add Payment</button>
    </form>
    <a href="{{ url_for('payments') }}">Back to Payments</a>
</body>
</html>
