<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}">Products</a>
        <a href="{{ url_for('customers') }}">Customers</a>
        <a href="{{ url_for('suppliers') }}">Suppliers</a>
        <a href="{{ url_for('employees') }}">Employees</a>
        <a href="{{ url_for('sales') }}">Sales</a>
        <a href="{{ url_for('payments') }}">Payments</a>
    </nav>
    <hr>

    <h1>Edit Product</h1>

    <form method="POST" action="{{ url_for('edit_product', id=product['ProductID']) }}">
        <label>Name:</label>
        <input type="text" name="name" value="{{ product['Name'] }}" required><br>

        <label>Model:</label>
        <input type="text" name="model" value="{{ product['Model'] }}"><br>

        <label>Price:</label>
        <input type="number" step="0.01" name="price" value="{{ product['Price'] }}" required><br>

        <label>Stock:</label>
        <input type="number" name="stock" value="{{ product['Stock'] }}"><br>

        <label>Supplier:</label>
        <select name="supplier_id" required>
            <option value="">Select Supplier</option>
            {% for supplier in suppliers %}
                <option value="{{ supplier['SupplierID'] }}"
                    {% if supplier['SupplierID'] == product['SupplierID'] %} selected {% endif %}>
                    {{ supplier['SupplierID'] }} - {{ supplier['Name'] }}
                </option>
            {% endfor %}
        </select><br><br>

        <button type="submit">Update Product</button>
        <a href="{{ url_for('index') }}">Cancel</a>
    </form>
</body>
</html>
